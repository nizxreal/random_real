<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat Malam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a 70%, #020617);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 48px 32px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .moon {
      font-size: 56px;
      margin-bottom: 16px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #e2e8f0;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
    }
    .stars {
      color: #fbbf24;
      font-size: 0.9rem;
      margin-top: 24px;
      letter-spacing: 4px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="moon">&#127769;</div>
    <h1>Selamat Malam</h1>
    <p>Istirahat yang cukup. Semoga harimu menyenangkan dan esok hari membawa hal-hal baik.</p>
    <div class="stars">&#10024; &#10024; &#10024;</div>
  </div>
</body>
</html>
