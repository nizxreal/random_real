<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ucapan selamat malam sederhana yang bisa dibuka siapa saja." />
  <title>Selamat Malam</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <main class="wrap">
    <section class="card">
      <p class="eyebrow" id="tanggal">Memuat tanggal...</p>

      <h1 class="greeting" id="greeting">Selamat Malam</h1>

      <p class="line" id="baris-ucapan" aria-live="polite">
        Istirahat yang cukup. Semoga harimu menyenangkan dan esok hari membawa hal-hal baik.
      </p>

      <p class="clock" id="jam" aria-live="off">--:--:--</p>

      <div class="field">
        <label for="nama">Ucapan untuk siapa?</label>
        <input id="nama" name="nama" type="text" placeholder="Nama (opsional)" maxlength="40" autocomplete="off" />
      </div>

      <div class="actions">
        <button type="button" id="btn-ganti">Ganti ucapan</button>
        <button type="button" id="btn-salin" class="primary">Salin ucapan</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <p class="foot" id="indeks-ucapan">Ucapan 1 dari 5</p>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
