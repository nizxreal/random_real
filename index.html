<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ucapan motivasi untuk Savira" />
  <title>Ucapan untuk Savira</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <main class="wrap">
    <section class="card">
      <p class="eyebrow" id="tanggal">Memuat tanggal...</p>

      <h1 class="greeting" id="greeting">Selamat Malam</h1>

      <div class="flow">
        <p class="line" id="baris-ucapan" aria-live="polite"></p>
        <p class="clock" id="jam" aria-live="off">--:--:--</p>
      </div>

      <div class="actions">
        <button type="button" id="btn-ganti" class="primary">Ganti ucapan</button>
        <button type="button" id="btn-salin" class="secondary">Salin ucapan</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <p class="foot" id="indeks-ucapan">Ucapan 1 dari 10</p>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
