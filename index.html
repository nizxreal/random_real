<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ucapan motivasi untuk Savira" />
  <title>Ucapan untuk Savira</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <main class="wrap">
    <section class="card">
      <p class="eyebrow" id="tanggal">Memuat tanggal...</p>

      <h1 class="greeting" id="greeting">Selamat Malam</h1>

      <div class="flow">
        <p class="line" id="baris-ucapan" aria-live="polite"></p>
        <p class="clock" id="jam" aria-live="off">--:--:--</p>
      </div>

      <div class="actions">
        <button type="button" id="btn-buka" class="primary">Buka</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <p class="foot" id="indeks-ucapan">Ucapan 1 dari 10</p>
  </main>

  <!-- Modal Gallery Foto -->
  <div class="modal" id="modal-gallery">
    <div class="modal-content">
      <button type="button" class="modal-close" id="modal-close" aria-label="Tutup">✕</button>
      <div class="gallery-container">
        <div class="photo-item photo-left-1"></div>
        <div class="photo-item photo-right-1"></div>
        <div class="photo-item photo-left-2"></div>
        <div class="photo-item photo-right-2"></div>
        <div class="photo-item photo-left-3"></div>
        <div class="photo-item photo-right-3"></div>
      </div>
    </div>
  </div>

  <!-- Modal Kue Ulang Tahun -->
  <div class="modal" id="modal-cake">
    <div class="modal-content cake-content">
      <button type="button" class="modal-close" id="cake-close" aria-label="Tutup">✕</button>
      <div class="cake-container">
        <div class="cake">
          <div class="cake-layer cake-layer-bottom"></div>
          <div class="cake-layer cake-layer-middle"></div>
          <div class="cake-layer cake-layer-top"></div>
          <div class="candle candle-1">
            <div class="flame"></div>
          </div>
          <div class="candle candle-2">
            <div class="flame"></div>
          </div>
          <div class="candle candle-3">
            <div class="flame"></div>
          </div>
        </div>
        <p class="cake-text">Selamat Ulang Tahun Savira! 🎉</p>
      </div>
    </div>
  </div>

  <!-- Modal Kartu Ucapan -->
  <div class="modal" id="modal-greeting">
    <div class="modal-content greeting-card-content">
      <button type="button" class="modal-close" id="greeting-close" aria-label="Tutup">✕</button>
      <div class="greeting-card">
        <div class="greeting-card-front">
          <p class="greeting-card-title">Ucapan Spesial</p>
          <p class="greeting-card-emoji">✨ 🎂 ✨</p>
          <button type="button" id="btn-buka-kartu" class="greeting-card-button">Buka Kartu</button>
        </div>
        <div class="greeting-card-back hidden">
          <p class="greeting-card-message" id="greeting-message"></p>
          <button type="button" id="btn-tutup-kartu" class="greeting-card-button-back">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
